[project]
name = "probing-control"
version = "0.1.0"
description = "Evaluation-awareness probing control experiment on Petri audits: paired clean/injected arms, post-task debrief labels, three-view monitors, pipelined runner and dashboard."
requires-python = ">=3.12"
dependencies = [
    "inspect-petri==3.1.1",
    "inspect-ai==0.3.276",
    "inspect-scout==0.5.3",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probing_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
